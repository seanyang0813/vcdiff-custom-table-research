[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcdiff-table-opt"
version = "0.1.0"
description = "Exact restricted custom code-table optimization for RFC 3284 traces"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
]

[project.scripts]
vcdiff-table-opt = "vcdiff_opt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

